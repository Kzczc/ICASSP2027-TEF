[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tef-mind"
version = "1.0.0"
description = "Tempered Evidence Fusion (TEF) of sentence-level LLM judgments and the MIND benchmark"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
api = ["openai>=1.40"]
vllm = ["vllm>=0.6"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["tef*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
